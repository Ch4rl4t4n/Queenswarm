<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Let Agents Cook — Verified Agent Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="marketing.css"/>
<style>
  /* page-level enter — transform only, stays visible if frame is paused */
  @keyframes route-fade-kf { from { transform: translateY(8px); } to { transform: translateY(0); } }
  .route-fade { animation: route-fade-kf 0.3s ease-out; }
</style>
</head>
<body>

<template id="__bundler_thumbnail" data-bg-color="#0a0820">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0820"/>
    <circle cx="600" cy="330" r="230" fill="none" stroke="#7c5cff" stroke-width="3" opacity="0.25"/>
    <text x="600" y="400" font-family="Inter, system-ui, sans-serif" font-size="210" font-weight="900" fill="#F2B81C" text-anchor="middle" letter-spacing="8">LAC</text>
    <text x="600" y="480" font-family="ui-monospace, monospace" font-size="34" fill="#b8bee0" text-anchor="middle" letter-spacing="18">LET AGENTS COOK</text>
  </svg>
</template>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="lac-mark.jsx"></script>
<script type="text/babel" src="lac-data.jsx"></script>
<script type="text/babel" src="lac-shell.jsx"></script>
<script type="text/babel" src="lac-home.jsx"></script>
<script type="text/babel" src="lac-catalog.jsx"></script>
<script type="text/babel" src="lac-detail.jsx"></script>
<script type="text/babel" src="lac-static.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp } = React;

function parseRoute() {
  const h = (window.location.hash || '#/').replace(/^#/, '');
  return h || '/';
}

function App() {
  const [route, setRoute] = useStateApp(parseRoute());

  useEffectApp(() => {
    const onHash = () => setRoute(parseRoute());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (to) => {
    window.location.hash = to;
    setRoute(to);
    window.scrollTo(0, 0);
  };

  const { MarketingShell } = window.LAC;
  const { HomePage } = window.LACHome;
  const { CatalogPage } = window.LACCatalog;
  const { ProductDetail } = window.LACDetail;
  const { HowItWorks, VerifyFirst } = window.LACStatic;

  let page;
  if (route === '/' || route === '') page = <HomePage navigate={navigate}/>;
  else if (route === '/skills') page = <CatalogPage navigate={navigate}/>;
  else if (route.startsWith('/skills/')) page = <ProductDetail slug={route.replace('/skills/', '')} navigate={navigate}/>;
  else if (route === '/how-it-works') page = <HowItWorks navigate={navigate}/>;
  else if (route === '/verify-first') page = <VerifyFirst navigate={navigate}/>;
  else page = <HomePage navigate={navigate}/>;

  return (
    <MarketingShell route={route} navigate={navigate}>
      <div className="route-fade" key={route}>{page}</div>
    </MarketingShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
