name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_deep_validation:
        description: "Run deep validation (full e2e + final150 gates)"
        required: false
        default: "false"
      run_whole_app_extended:
        description: "Run Whole-App extended visual gate (responsive shell + snapshots)"
        required: false
        default: "false"
      run_prod_journeys:
        description: "Run Whole-App prod authenticated journey matrix (needs OPERATOR_USER_BEARER_TOKEN secret)"
        required: false
        default: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: python -m pip install -r requirements.txt

      - name: pytest + coverage gate
        env:
          PLUGIN_USER_DIR: /tmp/queenswarm-plugins/user
        run: pytest -q --tb=short --cov=app --cov-config=.coveragerc

      - name: Operator Control Plane gate
        working-directory: .
        run: ./scripts/audit-operator-control-plane-gate.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: Responsive shell e2e (390 / 768 / 1280)
        env:
          CI: "true"
        run: npx playwright test e2e/responsive-shell.spec.ts

      - name: Responsive visual regression (mobile + tablet)
        env:
          CI: "true"
        run: npx playwright test e2e/responsive-visual.spec.ts

      - name: PWA shell e2e (manifest + offline)
        env:
          CI: "true"
        run: npx playwright test e2e/pwa-shell.spec.ts

      - name: Smoke e2e (hive shell)
        env:
          CI: "true"
        run: npx playwright test e2e/smoke-shell.spec.ts

      - name: Execution Studio e2e
        env:
          CI: "true"
          E2E_EXECUTION_STUDIO: "1"
        run: npx playwright test e2e/execution-studio.spec.ts

      - name: Execution Studio supervisor flow e2e
        env:
          CI: "true"
          E2E_EXECUTION_STUDIO_SUPERVISOR: "1"
        run: npx playwright test e2e/execution-studio-supervisor-flow.spec.ts

      - name: Publish lane e2e
        env:
          CI: "true"
          E2E_PUBLISH_LANE: "1"
        run: npx playwright test e2e/publish-lane.spec.ts

  whole_app_ui_gate:
    name: Whole-App UI release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Whole-App UI core release gate
        env:
          CI: "true"
          SKIP_HEALTH_CHECK: "1"
          PLAYWRIGHT_WORKERS: "1"
        run: ./scripts/whole-app-ui-release-gate.sh

  whole_app_ui_extended:
    name: Whole-App extended visual gate
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.run_whole_app_extended == 'true' || inputs.run_deep_validation == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Whole-App extended visual gate
        env:
          CI: "true"
          WHOLE_APP_EXTENDED_ONLY: "1"
          PLAYWRIGHT_WORKERS: "1"
        run: ./scripts/whole-app-ui-release-gate.sh

  whole_app_prod_journeys:
    name: Whole-App prod authenticated journeys
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_prod_journeys == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Prod authenticated journey matrix
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "https://queenswarm.love"
          E2E_PROD_AUTHENTICATED: "1"
          OPERATOR_USER_BEARER_TOKEN: ${{ secrets.OPERATOR_USER_BEARER_TOKEN }}
        run: ../scripts/whole-app-prod-journey-gate.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install -r requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Security gates
        env:
          SECURITY_STRICT: "1"
        run: bash scripts/security-gates.sh

      - name: Single-admin guardrails
        run: bash scripts/audit-single-admin-gate.sh

  deep_validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_validation == 'true' }}
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install -r requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
          npx playwright install chromium --with-deps

      - name: Final 150 deep gates
        env:
          RUN_FULL_E2E: "1"
          E2E_PHASE70_NAV: "1"
          E2E_PHASE120_ECOSYSTEM: "1"
          E2E_PHASE14_OPERATOR_FLOWS: "1"
          E2E_PHASE61_SUPERVISOR: "1"
          RUN_SECURITY_GATES: "1"
          SECURITY_STRICT: "1"
        run: bash scripts/final-150-gates.sh
