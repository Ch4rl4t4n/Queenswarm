name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_deep_validation:
        description: "Run deep validation (full e2e + final150 gates)"
        required: false
        default: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        run: python -m pip install -r requirements.txt

      - name: pytest + coverage gate
        run: pytest -q --tb=short --cov=app --cov-config=.coveragerc --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: Smoke e2e (hive shell)
        env:
          CI: "true"
        run: npm run test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install -r requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci

      - name: Security gates
        env:
          SECURITY_STRICT: "1"
        run: bash scripts/security-gates.sh

  deep_validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_validation == 'true' }}
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          cd backend
          python -m pip install -r requirements.txt

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
          npx playwright install chromium --with-deps

      - name: Final 150 deep gates
        env:
          RUN_FULL_E2E: "1"
          E2E_PHASE70_NAV: "1"
          E2E_PHASE120_ECOSYSTEM: "1"
          RUN_SECURITY_GATES: "1"
          SECURITY_STRICT: "1"
        run: bash scripts/final-150-gates.sh
