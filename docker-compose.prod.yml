# Production overlay — https://queenswarm.love
# Usage: ./scripts/deploy-prod.sh
#
# Phase 5.2: **~32 GB RAM** single-host posture (raise ``docker-compose.base.yml`` ceilings for DB, API, workers).
# For ~16 GB hosts, fork this file or override ``mem_limit`` via a local gitignored compose snippet.
#
# docker compose -p queenswarm_prod -f docker-compose.base.yml -f docker-compose.prod.yml --env-file .env.prod up -d

name: queenswarm_prod

# Production: never publish data-plane ports to the public host — only nginx 80/443.
services:
  postgres:
    mem_limit: 5120m
    cpus: "2.0"
    ports: !reset []

  redis:
    mem_limit: 1024m
    cpus: "0.75"
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod — run scripts/ensure-redis-password.sh}
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12

  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 3G
    mem_limit: 4096m
    cpus: "1.5"
    ports: !reset []

  backend:
    env_file:
      - ${QS_ENV_FILE_PROD:-.env.prod}
    environment:
      DR_REPORTS_DIR: ${DR_REPORTS_DIR:-/app/reports/dr}
      HA_REPORTS_DIR: ${HA_REPORTS_DIR:-/app/reports/ha}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      SIMULATION_MAX_PARALLEL: ${SIMULATION_MAX_PARALLEL:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
    volumes:
      - ./reports:/app/reports:ro
    mem_limit: 10240m
    cpus: "4.0"
    ports: !reset []

  celery-worker:
    env_file:
      - ${QS_ENV_FILE_PROD:-.env.prod}
    environment:
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      SIMULATION_MAX_PARALLEL: ${SIMULATION_MAX_PARALLEL:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
    mem_limit: 3072m
    cpus: "1.75"

  celery-beat:
    env_file:
      - ${QS_ENV_FILE_PROD:-.env.prod}
    environment:
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-8}
      SIMULATION_MAX_PARALLEL: ${SIMULATION_MAX_PARALLEL:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}

  grafana:
    environment:
      GF_SERVER_DOMAIN: ${DOMAIN:-queenswarm.love}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://queenswarm.love/grafana/}
    mem_limit: 768m
    cpus: "0.75"
    ports: !reset []

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://queenswarm.love/api/v1}
        NEXT_PUBLIC_HIVE_WS_GUEST: ${NEXT_PUBLIC_HIVE_WS_GUEST:-true}
        NEXT_PUBLIC_BALLROOM_GUEST_WS: ${NEXT_PUBLIC_BALLROOM_GUEST_WS:-true}
        NEXT_PUBLIC_QS_POLL_PROFILE: ${NEXT_PUBLIC_QS_POLL_PROFILE:-low_ram}
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://queenswarm.love/api/v1}
      NEXT_PUBLIC_HIVE_WS_GUEST: ${NEXT_PUBLIC_HIVE_WS_GUEST:-true}
      NEXT_PUBLIC_BALLROOM_GUEST_WS: ${NEXT_PUBLIC_BALLROOM_GUEST_WS:-true}
      NEXT_PUBLIC_QS_POLL_PROFILE: ${NEXT_PUBLIC_QS_POLL_PROFILE:-low_ram}
      INTERNAL_BACKEND_ORIGIN: http://backend:8000
      HIVE_PROXY_JWT: ${DASHBOARD_JWT:-unset}
      NODE_ENV: production
    mem_limit: 1536m
    cpus: "1.25"
    ports: !reset []

  prometheus:
    mem_limit: 1024m
    cpus: "1.0"
    ports: !reset []

  nginx:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/queenswarm.love.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    mem_limit: 512m
    cpus: "0.75"
