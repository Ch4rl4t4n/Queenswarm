# Mirrors docker/prometheus.yml (Compose mounts docker/prometheus.yml by default).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: queenswarm-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - "backend:8000"
