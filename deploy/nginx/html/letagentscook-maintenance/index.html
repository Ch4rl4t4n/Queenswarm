<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Let Agents Cook — Coming soon</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f0f2ff;
        background:
          radial-gradient(900px 600px at 12% 10%, rgba(126, 63, 190, 0.35), transparent 60%),
          radial-gradient(700px 500px at 95% 90%, rgba(85, 37, 131, 0.25), transparent 60%),
          linear-gradient(168deg, #0b0820 0%, #100c28 50%, #0a0820 100%);
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #f2b81c;
      }
      p {
        margin-top: 1rem;
        line-height: 1.6;
        color: #c7bee2;
        font-size: 1rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1.25rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f2b81c;
        border: 1px solid rgba(242, 184, 28, 0.35);
        background: rgba(242, 184, 28, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">Under construction</div>
      <h1>Let Agents <span>Cook</span></h1>
      <p>
        We&apos;re finishing the storefront. Verified agent skills and content packs will be listed here soon.
      </p>
    </main>
  </body>
</html>
