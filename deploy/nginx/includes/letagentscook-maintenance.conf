# Marketing site OFF — serve maintenance page (503). Re-enable: swap to letagentscook-proxy.conf in letagentscook.org.conf

location ^~ /api/v1/ {
    return 503;
}

location ^~ /health {
    return 503;
}

location / {
    return 503;
}

error_page 503 /letagentscook-maintenance/index.html;

location = /letagentscook-maintenance/index.html {
    root /var/www;
    internal;
    add_header Retry-After "86400" always;
    add_header Cache-Control "no-store" always;
}
