# Marketing edge — https://letagentscook.org (sales/catalog; app stays on queenswarm.love)
# Toggle: maintenance (public OFF) vs proxy (public LIVE) — swap include below.

server {
    listen 80;
    listen [::]:80;
    server_name letagentscook.org www.letagentscook.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name letagentscook.org www.letagentscook.org;

    ssl_certificate /etc/letsencrypt/live/letagentscook.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letagentscook.org/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:QS_SSL:10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    proxy_http_version 1.1;
    client_max_body_size 15m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/includes/letagentscook-maintenance.conf;
    # include /etc/nginx/includes/letagentscook-proxy.conf;
}
