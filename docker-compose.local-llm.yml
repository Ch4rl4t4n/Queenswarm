# Track M — optional Ollama sidecar for local_sovereign routing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.local-llm.yml up -d ollama
#
# Then set in .env.prod (or host .env):
#   LOCAL_LLM_ENABLED=true
#   OLLAMA_API_BASE=http://ollama:11434   # inside compose network
#   OLLAMA_DEFAULT_MODEL=ollama/qwen2.5:7b
#   LLM_ROUTING_MODE=local_sovereign      # tenant setting via Settings UI
#   LLM_AIRGAP=1                          # optional hard block on cloud hops

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ollama_models:
